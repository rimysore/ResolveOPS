services:
  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    image: node:22-slim
    working_dir: /app
    command: npm run dev
    volumes:
      - .:/app
      - resolveops_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  resolveops_node_modules:

